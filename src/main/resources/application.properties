# ============================================================
# 예시 설정파일 - 실제 접속정보/키는 절대 여기 넣지 말 것.
# 배포 시 환경변수 또는 시크릿 매니저로 주입한다.
# ============================================================

# Original DB
spring.original.datasource.jdbc-url=${ORIGINAL_DB_URL}
spring.original.datasource.username=${ORIGINAL_DB_USERNAME}
spring.original.datasource.password=${ORIGINAL_DB_PASSWORD}

# Target DB
spring.target.datasource.jdbc-url=${TARGET_DB_URL}
spring.target.datasource.username=${TARGET_DB_USERNAME}
spring.target.datasource.password=${TARGET_DB_PASSWORD}

mybatis.config-location=classpath:mybatis-config.xml

# cron 표현식: 초 분 시 일 월 요일
set.cron.user.time=${USER_SYNC_CRON:0 0/10 * * * *}
set.cron.group.time=${GROUP_SYNC_CRON:0 0/30 * * * *}

# 조회/등록/수정 쿼리 - 실제 쿼리는 비공개 (사내 배포 설정에서 주입)
original.query.user.select=
original.query.group.select=

target.query.group.select=
target.query.group.insert=
target.query.group.update=
target.query.group.use.update=
target.query.user.insert=
target.query.user.update=
target.query.update=
target.query.user.id.select=
target.query.group.id.select=

# jasypt 마스터 키 (AES로 감싼 값) - 환경변수로 주입
jasypt.encryptor.key=${JASYPT_ENCRYPTOR_KEY}

# 로그 파일 저장 위치
LOG_PATH=${LOG_PATH:/data/log/agent-sync}
